name: Build DouX Deb

on:
  workflow_dispatch:
    inputs:
      scheme:
        description: "Theos package scheme"
        required: true
        default: "rootless"
        type: choice
        options:
          - rootless
          - roothide

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Cache Theos and SDKs
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: /opt/theos
          key: ${{ runner.os }}-theos-sdk-v1

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Accept Xcode License
        run: sudo xcodebuild -license accept

      - name: Install Theos
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt/theos
          sudo chown -R $(whoami) /opt/theos
          git clone --recursive https://github.com/roothide/theos.git /opt/theos
          brew install ldid xz

      - name: Install iOS SDK
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          mkdir -p /opt/theos/sdks
          cd /opt/theos/sdks
          for i in {1..3}; do
            curl -L -o iPhoneOS16.5.sdk.tar.xz https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz && break
            echo "SDK download failed. Retrying in 5 seconds..."
            sleep 5
          done
          tar -xf iPhoneOS16.5.sdk.tar.xz
          rm iPhoneOS16.5.sdk.tar.xz
          ls -l /opt/theos/sdks/

      - name: Build tweak (${{ inputs.scheme }})
        run: |
          export THEOS=/opt/theos
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=${{ inputs.scheme }} ARCHS=arm64
          ls -l packages/

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: doux-deb-${{ inputs.scheme }}
          path: packages/*.deb
